<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#08090a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           bgcolor="#08090a" style="background-color:#08090a;">
      <tr>
        <td align="center" style="padding:40px 16px;">

          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
                 style="width:560px; max-width:100%;">

            <tr>
              <td style="padding-bottom:32px;">
                <span style="font-family:Helvetica,Arial,sans-serif; font-size:20px;
                             font-weight:700; letter-spacing:-0.4px; color:#f4f5f6;">dafa<span
                  style="color:#e0a33c;">labs</span></span>
              </td>
            </tr>

            <tr>
              <td bgcolor="#101214" style="background-color:#101214; border:1px solid #23262a;
                                           padding:40px 36px;">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <tr>
              <td style="padding-top:28px; font-family:Helvetica,Arial,sans-serif;
                         font-size:12px; line-height:20px; color:#7d838a;">
                {% block footer %}{% endblock %}
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
