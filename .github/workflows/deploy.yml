name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: api
        run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy to server
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -p "$PORT" "$USER@$HOST" \
            DIR="$DIR" 'bash -euo pipefail -s' <<'REMOTE'
          cd "$DIR"
          git fetch --prune origin
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f
          REMOTE

      - name: Verify
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -p "$PORT" "$USER@$HOST" \
            DIR="$DIR" 'bash -euo pipefail -s' <<'REMOTE'
          cd "$DIR"
          health() {
            docker inspect -f '{{.State.Health.Status}}' "$1" 2>/dev/null | tail -n1 || true
          }
          for i in $(seq 1 30); do
            web=$(health dafalabs-web)
            api=$(health dafalabs-api)
            if [ "$web" = healthy ] && [ "$api" = healthy ]; then
              echo "web=$web api=$api"
              exit 0
            fi
            sleep 5
          done
          echo "containers did not become healthy: web=${web:-missing} api=${api:-missing}"
          docker compose ps
          docker compose logs --tail 80
          exit 1
          REMOTE

      - name: Clean up SSH
        if: always()
        run: rm -rf ~/.ssh
